[package]
name = "shuttle"
version = "0.1.0"
edition = "2021"
description = "a cross-platform utility for moving files, data, and services between machines."
license = "Unlicense"

[[bin]]
name = "shuttle"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
quinn = { version = "0.11", features = ["rustls"] }
quinn-proto = "0.11"
rustls = { version = "0.23", features = ["std"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
bincode = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes = "1"
anyhow = "1"
thiserror = "1"
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["fs", "trace"] }
hyper = "1"
http = "1"
mime_guess = "2"
tokio-util = { version = "0.7", features = ["io-util"] }
rand = "0.8"
rcgen = "0.12"
rustls-pemfile = "2"
webpki-roots = "0.26"
local-ip-address = "0.6"
uuid = { version = "1", features = ["v4", "serde"] }
syntect = "5"
glob = "0.3"

[dev-dependencies]
tempfile = "3"
tokio-test = "0.4"

[profile.release]
opt-level = 3
lto = true
